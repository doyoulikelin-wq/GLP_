name: repository-policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout v4 commit; do not replace with an unpinned branch.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate repository policy
        run: python3 shared/main/repository_policy/check_repository_policy.py
